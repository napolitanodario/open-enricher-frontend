name: Validate development preview
on:
  push:
    branches: [feature/evaluation-performance-redesign]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-preview-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
